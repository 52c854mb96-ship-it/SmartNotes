# Fly.io-oppsett for SmartNotes. Se docs/DEPLOY.md for steg-for-steg-guide.
# Bytt ut app-navnet med ditt eget (må være unikt på Fly.io).
app = "smartnotes-ditt-navn"
primary_region = "arn" # Stockholm

[build]

[env]
  NODE_ENV = "production"
  PORT = "8080"
  DATA_DIR = "/data"
  CLAUDE_MODEL = "claude-sonnet-5-5"
  CLAUDE_EFFORT = "medium"

[http_service]
  internal_port = 8080
  force_https = true
  # Serveren konverterer notater i bakgrunnen, så den skal ikke stoppes når ingen bruker appen.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[mounts]]
  source = "smartnotes_data"
  destination = "/data"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
