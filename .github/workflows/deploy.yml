# Deploy til Fly.io. Kjører automatisk når CI er grønn på main, eller manuelt fra Actions-fanen.
# Gjør ingenting før variabelen FLY_APP er satt (se docs/OPPSETT.md).
name: Deploy til Fly.io

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.FLY_APP != '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: ${{ vars.FLY_APP }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Ved workflow_run: nøyaktig den committen som CI testet.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Sjekk at FLY_API_TOKEN finnes
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::Mangler secret FLY_API_TOKEN. Se steg 5 i docs/OPPSETT.md."
            exit 1
          fi

      - name: Sjekk at appen er opprettet
        id: app
        run: |
          if flyctl status --app "$FLY_APP" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Fant ikke appen $FLY_APP hos Fly.io. Kjør «Fly.io – første oppsett» først (steg 6 i docs/OPPSETT.md), og sjekk FLY_API_TOKEN."
            echo "exists=false" >> "$GITHUB_OUTPUT"
            # Startet for hånd: vis det som feil. Automatisk etter CI: hopp over uten å feile.
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then exit 1; fi
          fi

      - name: Bygg og deploy (første gang tar det noen minutter)
        if: steps.app.outputs.exists == 'true'
        run: flyctl deploy --remote-only --ha=false --app "$FLY_APP"

      - name: Sjekk at appen svarer
        if: steps.app.outputs.exists == 'true'
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "https://$FLY_APP.fly.dev/api/health"; then
              echo
              echo "SmartNotes kjører på https://$FLY_APP.fly.dev"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Appen svarte ikke. Se loggen med «fly logs --app $FLY_APP» eller i Fly.io-dashbordet."
          exit 1
