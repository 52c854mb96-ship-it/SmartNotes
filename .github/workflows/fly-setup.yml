# Første oppsett på Fly.io, rett fra GitHub (ingen verktøy å installere).
# Kjøres én gang: Actions → «Fly.io – første oppsett» → Run workflow. Se docs/OPPSETT.md.
# Trenger repository secrets FLY_API_TOKEN, APP_PASSWORD og ANTHROPIC_API_KEY og variabelen FLY_APP.
# Trygt å kjøre flere ganger: det som allerede finnes, hoppes over (passord og nøkkel oppdateres).
name: Fly.io – første oppsett

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-24.04
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: ${{ vars.FLY_APP }}
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Må være lik primary_region i fly.toml (arn = Stockholm).
      REGION: arn
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Sjekk at alt er lagt inn på GitHub
        run: |
          missing=0
          for v in FLY_API_TOKEN FLY_APP APP_PASSWORD ANTHROPIC_API_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::Mangler $v. Se steg 5 i docs/OPPSETT.md."
              missing=1
            fi
          done
          exit $missing

      - name: Opprett appen
        run: |
          if flyctl status --app "$FLY_APP" > /dev/null 2>&1; then
            echo "Appen $FLY_APP finnes allerede."
          else
            flyctl apps create "$FLY_APP" --org personal
          fi

      - name: Opprett lagringsvolum (database, originaler og PDF-er)
        run: |
          if flyctl volumes list --app "$FLY_APP" | grep -q smartnotes_data; then
            echo "Volumet finnes allerede."
          else
            flyctl volumes create smartnotes_data --app "$FLY_APP" --region "$REGION" --size 3 --yes
          fi

      - name: Lagre passord og API-nøkkel som hemmeligheter hos Fly.io
        run: flyctl secrets set --app "$FLY_APP" --stage APP_PASSWORD="$APP_PASSWORD" ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY"

      - name: Neste steg
        run: echo "Ferdig. Kjør nå «Deploy til Fly.io» under Actions."
