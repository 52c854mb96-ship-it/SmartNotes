name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Installer TeX Live og poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-science texlive-pictures texlive-lang-european texlive-fonts-recommended \
            lmodern latexmk poppler-utils
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Installer Chromium for ende-til-ende-tester
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Bygg Docker-image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: smartnotes:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Røyktest av imaget (ekte LaTeX-kompilering, falsk Claude)
        run: |
          docker run -d --name sn -p 8080:8080 -e APP_PASSWORD=test -e SMARTNOTES_FAKE_CLAUDE=1 -e COOKIE_SECURE=false smartnotes:ci
          for i in $(seq 1 30); do curl -sf http://localhost:8080/api/health && break; sleep 2; done
          BASE=http://localhost:8080 PASSWORD=test scripts/smoke-test.sh
      - name: Serverlogg
        if: always()
        run: docker logs sn || true
